
[project]
name = "hw-5-computing"
version = "0.1.0"
description = "Library for BSE Computing for Data Science - Exercise 5"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[tool.uv.build-backend]
module-name = "library_Group_M_M_J"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
